[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-gs"
version = "0.1.0"
description = "3D and 4D Gaussian Splatting for physical inverse problems (InverseBench data)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muhammad Hussain Qureshi"}]
dependencies = ["torch>=2.1", "numpy", "scipy", "matplotlib", "pandas", "scikit-image", "lmdb", "requests", "tifffile"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
thesis-gs = "thesis_gs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
